name: Update market prices

# GitHub's own cron is throttled to roughly hourly. To get real 5-minute updates this workflow
# runs several fetch cycles inside ONE run (every ~5 min for ~6 min), then starts itself again
# with repository_dispatch (that event is allowed even when sent with GITHUB_TOKEN).
# The cron below is a recovery trigger if the self-chaining dispatch ever stops.
# GitHub may delay scheduled events under load; the dispatch chain is the primary cadence.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-prices]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: bazarnama-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch prices every 5 minutes (2 cycles) and commit each time
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CYCLES=2; [ "${{ github.event_name }}" = "workflow_dispatch" ] && CYCLES=1   # manual run: one quick cycle
          FAILED=0
          # Unit tests run in site-checks.yml on every code push. They must NOT gate this workflow: a broken
          # test used to stop every price update silently. Only the freshly written DATA is validated here.
          for cycle in $(seq 1 $CYCLES); do
            echo "=== cycle $cycle ==="
            if python3 update_prices.py; then
              python3 tools/record_run.py success "cycle $cycle fetched"
            else
              # A failed fetch is reported as a failure; half-written files are discarded, never published.
              echo "::error::update_prices.py failed in cycle $cycle"
              git checkout -- data/ api/ 2>/dev/null || true
              python3 tools/record_run.py failure "update_prices.py failed in cycle $cycle"
              FAILED=1
            fi
            if ! python3 tools/validate_site.py --data; then
              echo "::error::generated data failed validation in cycle $cycle; not publishing it"
              git checkout -- data/ api/ 2>/dev/null || true
              python3 tools/record_run.py failure "data validation failed in cycle $cycle"
              FAILED=1
            fi
            # The status pages embed a snapshot of the data, so they go stale unless rebuilt: refresh them
            # about once an hour (first 10 minutes of the hour) and on manual runs.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%M)" -lt 10 ]; then
              python3 tools/build_transparency.py || echo "::warning::transparency page not rebuilt"
              python3 tools/build_api_docs.py || echo "::warning::api-docs page not rebuilt"
            fi
            git add -A data/ api/ transparency.html api-docs.html
            if ! git diff --cached --quiet; then
              git commit -m "Update market prices and history"
              PUSHED=0
              for attempt in 1 2 3 4 5; do
                if git fetch origin main && git rebase --autostash origin/main && git push origin HEAD:main; then PUSHED=1; break; fi
                echo "Push attempt $attempt failed; retrying..."
                git rebase --abort 2>/dev/null || true
                sleep $((attempt * 5))
              done
              if [ "$PUSHED" -ne 1 ]; then
                echo "::error::git push failed after 5 attempts in cycle $cycle"
                FAILED=1
              fi
            fi
            if [ "$cycle" -lt "$CYCLES" ]; then sleep 270; fi
          done
          exit $FAILED

      - name: Start the next run (self-chaining)
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" -f event_type=update-prices || echo "dispatch failed; cron will restart the chain"
