name: Update market prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

# One writer at a time for the whole repository (prices and news share this group),
# so two scheduled runs can never push at the same moment.
concurrency:
  group: bazarnama-data-writes
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data and source regression tests
        run: python -m unittest discover -s tests -v

      - name: Fetch prices and update history
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python update_prices.py

      - name: Commit price and history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ api/
          if git diff --cached --quiet; then
            echo "No price or history changes."
            exit 0
          fi
          git commit -m "Update market prices and history"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
