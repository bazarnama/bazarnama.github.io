name: Update economic news

on:
  workflow_dispatch:
  schedule:
    - cron: "5-55/10 * * * *"   # offset from the price workflow (minutes 5, 15, 25 ...)

permissions:
  contents: write

concurrency:
  group: bazarnama-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Update news
        run: python update_news.py

      - name: Validate news data (a bad file is never published)
        run: python3 tools/validate_site.py --data

      - name: Commit news (only data/news.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes."
            exit 0
          fi
          git commit -m "Update economic news"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
