
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="بازارنما؛ مرجع نمایش قیمت ارز، طلا و رمزارز">
<title>بازارنما | بازارهای مالی</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,sans-serif;
background:#f3f7f6;
color:#19332e;
}
header{
background:#087e6e;
color:white;
padding:25px 6%;
}
header h1{margin:0;font-size:32px}
header p{margin:8px 0 0;font-size:13px}
.container{
max-width:1100px;
margin:auto;
padding:20px;
}
.hero{
background:linear-gradient(120deg,#087e6e,#20aa91);
color:white;
padding:30px;
border-radius:16px;
margin-bottom:22px;
}
.hero h2{margin-top:0}
.tabs{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:20px;
}
.tabs button{
border:0;
padding:10px 18px;
border-radius:25px;
background:white;
color:#087e6e;
cursor:pointer;
}
.tabs button.active{
background:#087e6e;
color:white;
}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:14px;
}
.card{
background:white;
border:1px solid #e0ebe7;
border-radius:13px;
padding:18px;
box-shadow:0 5px 15px #00000008;
}
.card h3{
font-size:14px;
color:#71847e;
margin-top:0;
}
.price{
font-size:21px;
font-weight:bold;
margin:12px 0;
}
.unit{
font-size:12px;
color:#71847e;
}
.section{
background:white;
padding:20px;
border-radius:14px;
margin-top:25px;
}
.section h2{font-size:19px}
table{
width:100%;
border-collapse:collapse;
}
th,td{
padding:13px 8px;
text-align:right;
border-bottom:1px solid #edf1ef;
font-size:13px;
}
th{color:#71847e}
footer{
text-align:center;
padding:30px 10px;
color:#71847e;
font-size:12px;
}
.note{
background:#fff5dc;
color:#765a18;
padding:12px;
border-radius:9px;
font-size:12px;
margin-top:18px;
}
</style>
</head>

<body>

<header>
<h1>بازارنما</h1>
<p>قیمت ارز، طلا، سکه و رمزارز</p>
</header>

<div class="container">

<div class="hero">
<h2>به بازارنما خوش آمدید</h2>
<p>نبض بازارهای مالی را در یک نگاه دنبال کنید.</p>
</div>

<div class="tabs">
<button class="active" onclick="showCategory('all',this)">همه</button>
<button onclick="showCategory('currency',this)">ارز</button>
<button onclick="showCategory('gold',this)">طلا و سکه</button>
<button onclick="showCategory('crypto',this)">رمزارز</button>
<button onclick="showCategory('energy',this)">انرژی</button>
</div>

<div class="cards" id="cards"></div>

<div class="section">
<h2>جدول قیمت‌ها</h2>
<table>
<thead>
<tr>
<th>نام</th>
<th>قیمت</th>
<th>واحد</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<div class="note">
قیمت‌ها در این نسخه هنوز به منبع داده زنده متصل نیستند.
برای نمایش قیمت واقعی باید API معتبر تنظیم شود.
</div>
</div>

</div>

<footer>
بازارنما | همراه شما در بررسی بازارهای مالی
</footer>

<script>
const data=[
{name:"دلار آمریکا",category:"currency",unit:"تومان"},
{name:"یورو",category:"currency",unit:"تومان"},
{name:"پوند انگلیس",category:"currency",unit:"تومان"},
{name:"طلای ۱۸ عیار",category:"gold",unit:"تومان"},
{name:"سکه امامی",category:"gold",unit:"تومان"},
{name:"نیم سکه",category:"gold",unit:"تومان"},
{name:"ربع سکه",category:"gold",unit:"تومان"},
{name:"اونس جهانی طلا",category:"gold",unit:"دلار"},
{name:"بیت کوین",category:"crypto",unit:"دلار"},
{name:"اتریوم",category:"crypto",unit:"دلار"},
{name:"نفت برنت",category:"energy",unit:"دلار"},
{name:"نفت WTI",category:"energy",unit:"دلار"}
];

function showCategory(category,button){
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");

const filtered=data.filter(item=>
category==="all" || item.category===category
);

document.getElementById("cards").innerHTML=
filtered.map(item=>`
<div class="card">
<h3>${item.name}</h3>
<div class="price">—</div>
<div class="unit">${item.unit}</div>
</div>
`).join("");

document.getElementById("rows").innerHTML=
filtered.map(item=>`
<tr>
<td>${item.name}</td>
<td>—</td>
<td>${item.unit}</td>
</tr>
`).join("");
}

showCategory("all",document.querySelector(".tabs button"));
</script>

</body>
</html>
