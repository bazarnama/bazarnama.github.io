name: Update market prices

# GitHub's own cron is throttled to roughly hourly. To get real 5-minute updates this workflow
# runs several fetch cycles inside ONE run (every ~5 min for ~6 min), then starts itself again
# with repository_dispatch (that event is allowed even when sent with GITHUB_TOKEN).
# The cron below is only a safety net that restarts the chain if it ever stops.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-prices]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: bazarnama-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests (never blocks price updates; failures show as an error annotation)
        run: python3 -m unittest discover -s tests || echo "::error::Unit tests failed - see log"

      - name: Fetch prices every 5 minutes (2 cycles) and commit each time
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CYCLES=2; [ "${{ github.event_name }}" = "workflow_dispatch" ] && CYCLES=1   # manual run: one quick cycle
          for cycle in $(seq 1 $CYCLES); do
            echo "=== cycle $cycle ==="
            python3 update_prices.py || echo "update_prices failed in cycle $cycle (continuing)"
            git add -A data/ api/
            if ! git diff --cached --quiet; then
              git commit -m "Update market prices and history"
              for attempt in 1 2 3 4; do
                git pull --rebase --autostash origin main && git push origin HEAD:main && break
                echo "Push attempt $attempt failed; retrying..."
                sleep $((attempt * 5))
              done
            fi
            [ "$cycle" -lt "$CYCLES" ] && sleep 270
          done
          exit 0

      - name: Start the next run (self-chaining)
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" -f event_type=update-prices || echo "dispatch failed; cron will restart the chain"
