<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#087e6e">
  <title>صفحه پیدا نشد | قیمت‌یار</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f7f6;color:#17332f;font-family:Tahoma,Arial,sans-serif}
    main{width:min(100%,520px);padding:36px 28px;text-align:center;background:#fff;border:1px solid #dce8e5;border-radius:24px;box-shadow:0 16px 48px #17332f0d}
    .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:#087e6e;color:#fff;font-size:28px;font-weight:800}
    h1{margin:0 0 12px;font-size:24px}p{line-height:2;color:#58716c;margin:0 0 24px}
    a{display:inline-block;padding:12px 22px;border-radius:12px;background:#087e6e;color:#fff;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid #e0a82e;outline-offset:3px}
    @media(prefers-color-scheme:dark){body{background:#101a19;color:#e7f1ef}main{background:#182523;border-color:#30423e}p{color:#b4c5c1}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ق</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>ممکن است نشانی صفحه تغییر کرده باشد یا صفحه حذف شده باشد. از صفحه اصلی قیمت‌یار ادامه بده.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
  </main>
</body>
</html>
