<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>بازارنما</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Lalezar&display=swap">
<style>
/* Layout: ticker strip, brand + status line, category tabs, six summary tiles, full price table. Numbers come from one DATA object that can be swapped by a JSON feed every 10 minutes. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --ink: #12201d;
  --muted: #587069;
  --line: #d9e2df;
  --accent: #0e7468;
  --accent-ink: #ffffff;
  --up: #15803d;
  --up-bg: #e2f4e8;
  --down: #b91c1c;
  --down-bg: #fbe6e6;
  --note-bg: #fff4d6;
  --note-ink: #6b4a00;
  --font-body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  --font-brand: "Lalezar", "Vazirmatn", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1311; --surface: #121d1a; --surface-2: #0f1916; --ink: #e5eeeb; --muted: #8ea49d;
    --line: #223430; --accent: #3fcab7; --accent-ink: #06201c; --up: #4ade80; --up-bg: #12301f;
    --down: #f87171; --down-bg: #3a1717; --note-bg: #3a2f10; --note-ink: #f3d78a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1311; --surface: #121d1a; --surface-2: #0f1916; --ink: #e5eeeb; --muted: #8ea49d;
  --line: #223430; --accent: #3fcab7; --accent-ink: #06201c; --up: #4ade80; --up-bg: #12301f;
  --down: #f87171; --down-bg: #3a1717; --note-bg: #3a2f10; --note-ink: #f3d78a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px; direction: rtl;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1100px; margin-inline: auto; }
.num { font-variant-numeric: tabular-nums; }

.ticker { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background: var(--ink); color: var(--bg); overflow: hidden; white-space: nowrap; font-size: 13px; }
.ticker-track { display: inline-flex; gap: 32px; padding: 7px 24px; animation: slide 60s linear infinite; }
.ticker:hover .ticker-track { animation-play-state: paused; }
.tk { display: inline-flex; gap: 8px; align-items: baseline; }
.tk b { font-weight: 700; }
.tk .u { color: #5ee08a; }
.tk .d { color: #ff8f8f; }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(50%); } }
@media (prefers-reduced-motion: reduce) { .ticker { overflow-x: auto; } .ticker-track { animation: none; } }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 18px 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { font-family: var(--font-brand); font-weight: 400; font-size: 34px; line-height: 1.1; margin: 0; color: var(--accent); }
.brand span, .date { color: var(--muted); font-size: 13px; }

.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; margin-bottom: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--up); }
.dot.warn { background: #d99a00; }
.status .sp { flex: 1; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 2px 14px; cursor: pointer; font-weight: 700; font-size: 13px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding-block: 0 14px; }
.tab { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 16px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab:hover { color: var(--ink); border-color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile .nm { color: var(--muted); font-size: 13px; }
.tile .vl { font-size: 22px; font-weight: 800; line-height: 1.3; }
.tile .vl.txt { font-size: 17px; }
.tile .vl small { font-size: 12px; font-weight: 400; color: var(--muted); margin-inline-start: 4px; }
.tile .as { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; white-space: nowrap; width: fit-content; }
.pill.up { color: var(--up); background: var(--up-bg); }
.pill.down { color: var(--down); background: var(--down-bg); }
.pill.na { color: var(--muted); background: var(--surface-2); font-weight: 400; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 8px; font-size: 17px; font-weight: 800; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { text-align: start; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.nm { font-weight: 700; }
td small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.mut { color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>

<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>بازارنما</h1><span>قیمت ارز، طلا، انرژی و رمزارز</span></div>
    <div class="date" id="date"></div>
  </header>

  <div class="status" id="status" role="status">
    <span class="dot" id="dot"></span>
    <span id="stxt"></span>
    <span class="sp"></span>
    <span class="mut" id="next"></span>
    <button class="btn" type="button" id="refresh">به‌روزرسانی</button>
  </div>

  <nav class="tabs" id="tabs" aria-label="دسته‌بندی بازار"></nav>
  <section class="tiles" id="tiles" aria-label="خلاصه بازار"></section>

  <section class="panel" aria-labelledby="tt">
    <h2 id="tt">جدول قیمت‌ها</h2>
    <div class="tw">
      <table>
        <thead><tr><th>نام</th><th>قیمت</th><th>تغییر روزانه</th><th>زمان و منبع</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <p class="foot">این صفحه توصیه مالی نیست. قیمت‌های بازار ایران بین فروشندگان تفاوت دارد و خط «—» یعنی عدد تأییدشده‌ای در دست نبود.</p>
</div>

<script>
(function () {
  document.documentElement.lang = "fa";
  document.documentElement.dir = "rtl";

  // Set this to a URL that returns JSON in the same shape as DATA.items to get live updates.
  // Inside this artifact the browser blocks outside requests, so it only works when the page is hosted elsewhere.
  var DATA_URL = "";
  var REFRESH_MS = 10 * 60 * 1000;

  var DATA = {
    updated: "۱۵ آبان ۱۴۰۵، حدود ساعت ۱۹",
    items: [
      { id: "usd", cat: "fx", name: "دلار آمریکا", sub: "بازار آزاد ایران", unit: "تومان", val: 267900, chg: null, dec: 0, asof: "نرخ فروش، از تیتر خبر امروز" },
      { id: "eur", cat: "fx", name: "یورو", sub: "بازار آزاد ایران", unit: "تومان", val: null, chg: null, dec: 0, asof: "عدد تأییدشده در دسترس نبود" },
      { id: "g18", cat: "gold", name: "طلای ۱۸ عیار", sub: "هر گرم", unit: "تومان", val: null, chg: null, dec: 0, asof: "عدد تأییدشده در دسترس نبود" },
      { id: "emami", cat: "gold", name: "سکه امامی", sub: "طرح جدید", unit: "تومان", val: null, text: "بیش از ۲۶۶ میلیون", chg: null, dec: 0, asof: "عدد دقیق نیست؛ از تیتر خبر امروز" },
      { id: "half", cat: "gold", name: "نیم‌سکه", sub: "طرح جدید", unit: "تومان", val: null, chg: null, dec: 0, asof: "عدد تأییدشده در دسترس نبود" },
      { id: "xau", cat: "gold", name: "اونس جهانی طلا", sub: "XAU/USD", unit: "دلار", val: 4039, chg: -2.01, dec: 0, asof: "۹:۱۱ صبح به وقت نیویورک (Fortune)" },
      { id: "brent", cat: "energy", name: "نفت برنت", sub: "هر بشکه", unit: "دلار", val: 97.15, chg: -1.13, dec: 2, asof: "امروز، قرارداد CFD (Trading Economics)" },
      { id: "wti", cat: "energy", name: "نفت وست تگزاس", sub: "هر بشکه", unit: "دلار", val: 90.18, chg: -0.37, dec: 2, asof: "امروز، قرارداد CFD (Trading Economics)" },
      { id: "btc", cat: "crypto", name: "بیت‌کوین", sub: "BTC/USD", unit: "دلار", val: 75409, chg: -6.3, dec: 0, asof: "۱۰:۳۰ صبح به وقت تهران (BTCC)" }
    ]
  };
  var CATS = [
    { id: "all", label: "همه" }, { id: "fx", label: "ارز" }, { id: "gold", label: "طلا و سکه" },
    { id: "energy", label: "انرژی" }, { id: "crypto", label: "رمزارز" }
  ];
  var FEATURED = ["usd", "emami", "xau", "brent", "wti", "btc"];
  var state = { cat: "all", live: false, error: "", nextAt: Date.now() + REFRESH_MS };

  var nfs = {};
  function fmt(v, dec) {
    if (!nfs[dec]) nfs[dec] = new Intl.NumberFormat("fa-IR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return nfs[dec].format(v);
  }
  function by(id) { return DATA.items.filter(function (i) { return i.id === id; })[0]; }
  function valHtml(it) {
    if (it.text) return it.text;
    if (it.val == null) return "—";
    return fmt(it.val, it.dec);
  }
  function chgHtml(it) {
    if (it.chg == null) return '<span class="pill na">نامشخص</span>';
    var up = it.chg >= 0;
    return '<span class="pill ' + (up ? "up" : "down") + ' num">' + (up ? "▲" : "▼") + " " + fmt(Math.abs(it.chg), 2) + "٪</span>";
  }

  function renderDate() {
    document.getElementById("date").textContent = new Intl.DateTimeFormat("fa-IR-u-ca-persian", { weekday: "long", year: "numeric", month: "long", day: "numeric" }).format(new Date());
  }
  function renderTicker() {
    var one = DATA.items.filter(function (i) { return i.val != null; }).map(function (it) {
      var c = it.chg == null ? "" : '<span class="' + (it.chg >= 0 ? "u" : "d") + '">' + (it.chg >= 0 ? "▲ " : "▼ ") + fmt(Math.abs(it.chg), 2) + "٪</span>";
      return '<span class="tk"><b>' + it.name + '</b><span class="num">' + fmt(it.val, it.dec) + "</span>" + c + "</span>";
    }).join("");
    document.getElementById("ticker").innerHTML = one + one;
  }
  function renderTabs() {
    var box = document.getElementById("tabs");
    box.innerHTML = "";
    CATS.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "tab"; b.textContent = c.label;
      b.setAttribute("aria-pressed", String(state.cat === c.id));
      b.onclick = function () { state.cat = c.id; renderTabs(); renderRows(); };
      box.appendChild(b);
    });
  }
  function renderTiles() {
    var box = document.getElementById("tiles");
    box.innerHTML = "";
    FEATURED.forEach(function (id) {
      var it = by(id);
      if (!it) return;
      var d = document.createElement("div");
      d.className = "tile";
      d.innerHTML = '<span class="nm">' + it.name + "</span>" +
        '<span class="vl num' + (it.text ? " txt" : "") + '">' + valHtml(it) + (it.val != null || it.text ? "<small>" + it.unit + "</small>" : "") + "</span>" +
        chgHtml(it);
      box.appendChild(d);
    });
  }
  function renderRows() {
    var body = document.getElementById("rows");
    body.innerHTML = "";
    DATA.items.filter(function (i) { return state.cat === "all" || i.cat === state.cat; }).forEach(function (it) {
      var tr = document.createElement("tr");
      tr.innerHTML = '<td class="nm">' + it.name + "<small>" + it.sub + "</small></td>" +
        '<td class="num">' + valHtml(it) + ((it.val != null || it.text) ? '<small>' + it.unit + "</small>" : "") + "</td>" +
        "<td>" + chgHtml(it) + "</td>" +
        '<td class="mut">' + it.asof + "</td>";
      body.appendChild(tr);
    });
  }
  function renderStatus() {
    var dot = document.getElementById("dot"), t = document.getElementById("stxt");
    if (state.live) { dot.className = "dot ok"; t.textContent = "داده زنده · آخرین به‌روزرسانی: " + DATA.updated; }
    else {
      dot.className = "dot warn";
      t.textContent = (state.error || "منبع داده زنده وصل نیست") + " · آخرین مقادیر ثبت‌شده: " + DATA.updated;
    }
  }
  function renderNext() {
    var s = Math.max(0, Math.round((state.nextAt - Date.now()) / 1000));
    document.getElementById("next").textContent = "به‌روزرسانی بعدی تا " + fmt(Math.floor(s / 60), 0) + ":" + fmt(s % 60, 0).padStart(2, "۰");
  }
  function renderAll() { renderTicker(); renderTiles(); renderRows(); renderStatus(); }

  function refresh() {
    state.nextAt = Date.now() + REFRESH_MS;
    if (!DATA_URL) { state.live = false; state.error = "آدرس منبع داده تنظیم نشده"; renderStatus(); return; }
    fetch(DATA_URL, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
      .then(function (j) {
        if (!j || !Array.isArray(j.items)) throw new Error("shape");
        DATA = { updated: j.updated || new Date().toLocaleTimeString("fa-IR"), items: j.items };
        state.live = true; state.error = ""; renderAll();
      })
      .catch(function () { state.live = false; state.error = "اتصال به منبع داده برقرار نشد"; renderStatus(); });
  }

  renderDate(); renderTabs(); renderAll(); renderNext();
  document.getElementById("refresh").onclick = refresh;
  setInterval(refresh, REFRESH_MS);
  setInterval(renderNext, 1000);
  refresh();
})();
</script>

</body></html>
